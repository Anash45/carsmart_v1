<style>
  :root {
    --bg: #0d0f0c;
    --card-bg: #16190f;
    --border: #2a2f22;
    --text: #f4f6ef;
    --muted: #9aa294;
    --accent: #99f22b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 40px 24px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .search {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    display: block;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .search:focus {
    outline: none;
    border-color: var(--accent);
  }
  .count {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 16px 0 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
    padding: 28px 24px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .thumb-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #05070a;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .thumb-wrap .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
  }
  .meta {
    padding: 12px 14px 14px;
  }
  .meta .title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .meta .filename {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    display: none;
  }
</style>

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const search = document.getElementById('search');

    function render(list) {
      grid.innerHTML = '';
      list.forEach(item => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = './' + item.file;
        a.target = '_blank';
        a.rel = 'noopener';

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = './' + item.thumb;
        img.alt = item.title;
        img.onerror = () => {
          thumbWrap.innerHTML = '<div class="placeholder">No preview</div>';
        };
        thumbWrap.appendChild(img);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = '<p class="title"></p><p class="filename"></p>';
        meta.querySelector('.title').textContent = item.title;
        meta.querySelector('.filename').textContent = item.file;

        a.appendChild(thumbWrap);
        a.appendChild(meta);
        grid.appendChild(a);
      });
      empty.style.display = list.length ? 'none' : 'block';
      count.textContent = list.length + ' page' + (list.length === 1 ? '' : 's');
    }

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      const filtered = !q ? items : items.filter(i =>
        i.title.toLowerCase().includes(q) || i.file.toLowerCase().includes(q)
      );
      render(filtered);
    });

    render(items);
  </script>
